<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anchoíta · Base de granos</title>
<style>
:root{--bg:#eef3f9;--fg:#1b2a3d;--mut:#5d7088;--card:#fff;--line:#cfdaea;--acc:#355477;--band:#8cabd5;--hi:#4f7fb8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--band)}header img{height:52px;border-radius:6px}header h1{margin:0;font:600 18px Georgia,serif;color:var(--acc)}header small{color:var(--acc)}.sp{flex:1}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px}
button{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:7px 12px;border-radius:999px;cursor:pointer;font:inherit;white-space:nowrap}
button.on,button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
main{padding:0 16px 40px;max-width:1400px;margin:auto}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--fg);max-width:100%}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.bar input{flex:1;min-width:150px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px}th{background:var(--acc);color:#fff;text-align:left;padding:8px;white-space:nowrap}
td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr[onclick]{cursor:pointer}tr[onclick]:hover td{background:#e3ecf7}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.card h3{margin:0 0 10px;font:600 15px Georgia,serif;color:var(--acc)}.card h2{margin:2px 0 0;color:var(--acc)}
.kpi,.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:12px}
.br{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:12px;margin:5px 0}.br span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br i{background:#e3ecf7;border-radius:6px;height:12px;display:block}.br b{display:block;height:12px;border-radius:6px;background:var(--hi)}.br em{font-style:normal;text-align:right}
h2.t{font:600 16px Georgia,serif;color:var(--acc);margin:18px 0 8px}.mut{color:var(--mut)}a{color:var(--hi)}
.login{max-width:380px;margin:40px auto;padding:20px;display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px}.login img{height:70px;align-self:center}.login h1{text-align:center;font:600 18px Georgia,serif;color:var(--acc);margin:0}
dialog{border:1px solid var(--line);border-radius:14px;width:min(680px,94vw);max-height:90vh;padding:16px}dialog::backdrop{background:#0008}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}.f .w{grid-column:1/-1}.act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px}dt{font-size:11px;color:var(--mut)}dd{margin:0}
.ok{background:#e3ecf7;border-radius:6px;padding:2px 8px;font-size:12px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:9}
@media(max-width:520px){.f{grid-template-columns:1fr}}@media print{nav,.bar,button,.noprint{display:none!important}header{background:none}}
</style></head><body><div id="app"></div><div id="toast"></div>

let sb,user,D={},A=[],view='dash',q='',gf='',det=null,tab='manual',imp=null;

function loginUI(){$('#app').innerHTML=`<div class="login"><img src="${LOGO}" alt="Logo"><h1>Anchoíta Chocolatería<br>Base de granos y elaboración</h1><input id="em" type="email" placeholder="Correo electrónico"><input id="pw" type="password" placeholder="Contraseña"><details ${LS.sbu?'':'open'} ${CFG.url?'hidden':''}><summary class="mut">Conexión Supabase</summary><br><input id="su" placeholder="Supabase URL" value="${esc(LS.sbu||'')}" style="width:100%"><br><br><input id="sk" placeholder="Supabase Anon Key" value="${esc(LS.sbk||'')}" style="width:100%"></details><button class="pri" onclick="login()">Iniciar sesión</button><p class="mut" style="font-size:12px;margin:0">Acceso restringido. Los datos de conexión se guardan solo en este navegador.</p></div>`}
async function login(){const u=CFG.url||$('#su').value.trim(),k=CFG.key||$('#sk').value.trim();if(!u||!k)return toast('Completá la conexión de Supabase');LS.sbu=u;LS.sbk=k;try{sb=supabase.createClient(u,k)}catch(e){return toast('URL o clave inválida')}
 const{data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)return toast(error.message);user=data.user;load()}
async function load(){const r=await Promise.all([...S.map(s=>sb.from(s.k).select('*').order('id')),sb.from('auditoria').select('*').order('fecha',{ascending:false}).limit(200)]);
 const er=r.find(x=>x.error);if(er)toast(er.error.message);S.forEach((s,i)=>D[s.k]=r[i].data||[]);A=r[S.length].data||[];render()}
const audit=(a,t,r)=>sb.from('auditoria').insert({usuario:user.email,accion:a,tabla:t,registro:String(r)});
function alerts(){const o=[];
 D.granos.filter(g=>!g.ficha_url).forEach(g=>o.push(['Media','Grano sin ficha técnica cargada',g.grano]));
 D.desc.filter(r=>r.peso_inicial>0&&r.nibs+r.cascarilla>r.peso_inicial).forEach(r=>o.push(['Alta','Nibs + cascarilla superan el peso inicial',r.grano+' · '+r.id_desc]));
 D.elab.filter(r=>r.temp_salida>45).forEach(r=>o.push(['Media','Temperatura de salida mayor a 45 °C ('+r.temp_salida+')',r.grano+' · '+r.id_elab]));
 D.pruebas.filter(r=>!r.fecha).forEach(r=>o.push(['Baja','Prueba de tostado sin fecha',r.grano+' · '+r.id_prueba]));
 return o.sort((a,b)=>'AMB'.indexOf(a[0][0])-'AMB'.indexOf(b[0][0]))}
const bars=(t,e,f=v=>v)=>{const m=Math.max(...e.map(x=>x[1]),1);return`<div class="card"><h3>${t}</h3>${e.map(([l,v])=>`<div class="br"><span>${esc(l)}</span><i><b style="width:${v/m*100}%"></b></i><em>${f(v)}</em></div>`).join('')}</div>`};
function dash(){const gs=D.granos.map(g=>g.grano),cnt=k=>gs.map(g=>[g,D[k].filter(r=>r.grano===g).length]);
 const ls=gs.map(g=>{const l=D.desc.filter(r=>r.grano===g).map(loss).filter(x=>x!=null);return[g,l.length?l.reduce((a,b)=>a+b)/l.length:0]});
 return`<h2 class="t">Panel de indicadores</h2><div class="kpi">${[['Granos',D.granos.length],['Pruebas de tostado',D.pruebas.length],['Elaboraciones',D.elab.length],['Alertas activas',alerts().length]].map(([a,b])=>`<div class="card"><small class="mut">${a}</small><h2>${b}</h2></div>`).join('')}</div><div class="g2">${bars('Pruebas de tostado por grano',cnt('pruebas'))}${bars('Elaboraciones por grano',cnt('elab'))}${bars('Pérdida promedio en descascarillado',ls,v=>v.toFixed(1)+'%')}</div>`}
function tbl(k,f){const s=T[k],rows=D[k].filter(r=>f?f(r):(!gf||k==='granos'||gOf(k,r)===gf)&&(!q||JSON.stringify(Object.values(r)).toLowerCase().includes(q)));
 return`<div class="wrap"><table><thead><tr>${s.c.map(c=>`<th>${esc(c[1])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr onclick="${k==='granos'?'ficha':'edit(\''+k+'\','}${k==='granos'?'('+r.id+')':r.id+')'}">${s.c.map(c=>`<td>${fm(c[2],r[c[0]])}</td>`).join('')}</tr>`).join('')||'<tr><td class="mut">Sin resultados</td></tr>'}</tbody></table></div><p class="mut">${rows.length} registro(s)</p>`}
function list(k){return`<h2 class="t">${T[k].t}</h2><div class="bar"><input id="q" placeholder="Buscar…" value="${esc(q)}" oninput="q=this.value.toLowerCase();render();const e=$('#q');e.focus();e.setSelectionRange(99,99)">${k!=='granos'?`<select onchange="gf=this.value;render()"><option value="">Todos los granos</option>${D.granos.map(g=>`<option ${g.grano===gf?'selected':''}>${esc(g.grano)}</option>`).join('')}</select>`:''}<button class="pri" onclick="edit('${k}',0)">+ Nuevo</button></div>`+tbl(k)}
function ficha(id){det=id;render()}
function fichaV(){const g=D.granos.find(x=>x.id===det),f=r=>r.grano===g.grano;
 return`<div class="bar"><button onclick="det=null;render()">← Volver</button><button class="pri" onclick="edit('granos',${g.id})">Editar</button><button onclick="print()">Imprimir ficha (PDF)</button></div><h2 class="t">${esc(g.grano)}</h2><dl>${T.granos.c.map(c=>`<div><dt>${esc(c[1])}</dt><dd>${fm(c[2],g[c[0]])||'—'}</dd></div>`).join('')}</dl>`+['pruebas','desc','elab'].map(k=>`<h2 class="t">${T[k].t}</h2>${tbl(k,f)}`).join('')}
function alertasV(){const a=alerts();return`<h2 class="t">Alertas del sistema</h2><p class="mut">Detección automática sobre los datos cargados.</p><div class="wrap"><table><thead><tr><th>Prioridad</th><th>Alerta</th><th>Registro</th></tr></thead><tbody>${a.map(x=>`<tr><td><span class="ok">${x[0]}</span></td><td>${esc(x[1])}</td><td>${esc(x[2])}</td></tr>`).join('')||'<tr><td colspan="3" class="mut">Sin alertas</td></tr>'}</tbody></table></div>`}
function adminV(){let h=`<h2 class="t">Administración de datos</h2><div class="bar">${[['manual','Carga manual'],['csv','Importar CSV'],['log','Auditoría']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</div>`;
 if(tab==='manual')h+=`<p class="mut">Elegí qué querés cargar:</p><div class="bar">${S.map(s=>`<button onclick="edit('${s.k}',0)">+ ${s.t}</button>`).join('')}</div>`;
 if(tab==='csv')h+=`<div class="card"><p>Archivo CSV con encabezados iguales a los nombres de columna (separado por coma o punto y coma). Se validan los números antes de guardar.</p><div class="bar"><select id="ck">${S.map(s=>`<option value="${s.k}">${s.t}</option>`).join('')}</select><input type="file" accept=".csv,text/csv" onchange="csvFile(event)"></div><div id="pv"></div></div>`;
 if(tab==='log')h+=`<div class="wrap"><table><thead><tr><th>Fecha y hora</th><th>Usuario</th><th>Acción</th><th>Módulo</th><th>Registro</th></tr></thead><tbody>${A.map(a=>`<tr><td>${new Date(a.fecha).toLocaleString('es-AR')}</td><td>${esc(a.usuario)}</td><td>${esc(a.accion)}</td><td>${esc(a.tabla)}</td><td>${esc(a.registro)}</td></tr>`).join('')||'<tr><td class="mut">Sin movimientos</td></tr>'}</tbody></table></div>`;
 return h}
function render(){if(!user)return;const nv=[['dash','Dashboard'],...S.map(s=>[s.k,s.t]),['alertas','Alertas'],['admin','Administración']];
 let m=det?fichaV():view==='dash'?dash():view==='alertas'?alertasV():view==='admin'?adminV():list(view);

function edit(k,id){const s=T[k],r=id?D[k].find(x=>x.id===id):{};const fl=s.c.map((c,i)=>{const v=r[c[0]]??'',n='f'+i;let e;

 else if(c[2]==='date')e=`<input id="${n}" type="date" value="${esc(v)}">`;else if(c[2]==='num')e=`<input id="${n}" type="number" step="any" value="${esc(v)}">`;

async function save(k,id){const s=T[k],o={};s.c.forEach((c,i)=>{let v=$('#f'+i).value.trim();o[c[0]]=v===''?null:c[2]==='num'?Number(v):v});
 const r=id?await sb.from(k).update(o).eq('id',id):await sb.from(k).insert(o);if(r.error)return toast(r.error.message);

function csvFile(e){const f=e.target.files[0];if(!f)return;const k=$('#ck').value,s=T[k];f.text().then(t=>{const L=t.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim()),d=L[0].includes(';')?';':',',sp=x=>x.split(d).map(v=>v.trim().replace(/^"|"$/g,'')),h=sp(L[0]),ix=h.map(x=>s.c.findIndex(c=>c[0]===x||c[1]===x));
 const rows=L.slice(1).map(l=>{const v=sp(l),o={};ix.forEach((j,i)=>{if(j>=0){const c=s.c[j],x=v[i];o[c[0]]=x===''||x==null?null:c[2]==='num'?Number(x.replace(',','.')):x}});return o});
 const bad=r=>Object.values(r).some(x=>typeof x==='number'&&isNaN(x)),ok=rows.filter(r=>!bad(r));imp={k,rows:ok};
 $('#pv').innerHTML=`<p>${ok.length} válidas · ${rows.length-ok.length} con errores · columnas reconocidas: ${ix.filter(j=>j>=0).length} de ${h.length}</p>${ok.length?'<button class="pri" onclick="doImp()">Confirmar e importar</button>':''}`})}

 await audit('Importar CSV',imp.k,imp.rows.length+' filas');imp=null;await load();toast('Importación completa')}
